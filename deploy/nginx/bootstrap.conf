server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    return 444;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name lastmile.airowire.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "TLS setup is in progress\n";
    }
}
